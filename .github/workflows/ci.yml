name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install packaging tools
        run: python -m pip install --upgrade build "setuptools>=77" wheel
      - name: Run unit tests
        run: python -m unittest
      - name: Compile Python sources
        run: python -m compileall -q red_widow tests
      - name: Check VS Code extension syntax
        run: npm --prefix vscode-extension test
      - name: Gate repository
        run: python -m red_widow gate --workspace . --offline --strict
