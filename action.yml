name: Red Widow
description: Gate VS Code-compatible IDE extensions, MCP config, and AI developer workflow risk.
branding:
  icon: shield
  color: red
inputs:
  workspace:
    description: Workspace directory to gate.
    required: false
    default: .
  policy:
    description: Optional Red Widow policy JSON file.
    required: false
    default: ""
  lockfile:
    description: Optional Red Widow lockfile. Defaults to red-widow.lock.json when present.
    required: false
    default: ""
  output-dir:
    description: Directory where gate and inventory reports are written.
    required: false
    default: red-widow-results
  offline:
    description: Do not resolve recommended extensions from marketplaces.
    required: false
    default: "true"
  installed:
    description: Include locally installed VS Code-compatible extensions on the runner.
    required: false
    default: "false"
  fail-on-review:
    description: Fail when the gate decision is REVIEW.
    required: false
    default: "false"
  upload-sarif:
    description: Upload the generated SARIF report through GitHub code scanning.
    required: false
    default: "false"
outputs:
  decision:
    description: Red Widow gate decision: PASS, REVIEW, or BLOCK.
    value: ${{ steps.red-widow.outputs.decision }}
  gate-json:
    description: Path to the JSON gate report.
    value: ${{ steps.red-widow.outputs.gate-json }}
  gate-markdown:
    description: Path to the Markdown gate report.
    value: ${{ steps.red-widow.outputs.gate-markdown }}
  gate-sarif:
    description: Path to the SARIF gate report.
    value: ${{ steps.red-widow.outputs.gate-sarif }}
  inventory-json:
    description: Path to the JSON inventory report.
    value: ${{ steps.red-widow.outputs.inventory-json }}
  exit-code:
    description: Red Widow gate process exit code.
    value: ${{ steps.red-widow.outputs.exit-code }}
runs:
  using: composite
  steps:
    - name: Install Red Widow
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Run Red Widow gate
      id: red-widow
      shell: bash
      env:
        RED_WIDOW_WORKSPACE: ${{ inputs.workspace }}
        RED_WIDOW_POLICY: ${{ inputs.policy }}
        RED_WIDOW_LOCKFILE: ${{ inputs.lockfile }}
        RED_WIDOW_OUTPUT_DIR: ${{ inputs.output-dir }}
        RED_WIDOW_OFFLINE: ${{ inputs.offline }}
        RED_WIDOW_INSTALLED: ${{ inputs.installed }}
        RED_WIDOW_FAIL_ON_REVIEW: ${{ inputs.fail-on-review }}
      run: bash "$GITHUB_ACTION_PATH/scripts/github_action.sh"
    - name: Upload Red Widow SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.red-widow.outputs.gate-sarif }}
    - name: Fail on Red Widow gate
      if: ${{ steps.red-widow.outputs.exit-code != '0' }}
      shell: bash
      run: exit "${{ steps.red-widow.outputs.exit-code }}"
